use_default_settings: true

server:
  secret_key: ${SEARXNG_SECRET}
  limiter: false
  image_proxy: false
  method: GET
  public_instance: false

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

general:
  instance_name: "Alveron Research Search"

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
