services:
  n8n-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in n8n/.env}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n} -d ${N8N_DB_NAME:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - n8n-internal

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.49.0
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
    ports:
      # Keep the editor private on the VPS. Expose it through an HTTPS reverse proxy.
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in n8n/.env}
      N8N_HOST: ${N8N_HOST:?Set N8N_HOST to the automation subdomain}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: 1
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in n8n/.env}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Africa/Lagos}
      TZ: ${GENERIC_TIMEZONE:-Africa/Lagos}
      # The API runs on the VPS host, outside this Compose project.
      ALVERON_API_BASE: ${ALVERON_API_BASE:-http://host.docker.internal:3100}
      ALVERON_API_URL: ${ALVERON_API_URL:-http://host.docker.internal:3100}
      ALVERON_INTERNAL_TOKEN: ${ALVERON_INTERNAL_TOKEN:-}
      ALVERON_WEBHOOK_TOKEN: ${ALVERON_WEBHOOK_TOKEN:-}
      ALVERON_TELEGRAM_BOT_TOKEN: ${ALVERON_TELEGRAM_BOT_TOKEN:-}
      ALVERON_TELEGRAM_CHAT_ID: ${ALVERON_TELEGRAM_CHAT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n-internal

volumes:
  n8n_data:
  n8n_postgres_data:

networks:
  n8n-internal:
    internal: true
